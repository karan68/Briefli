name: PR Quality Gate

on:
  workflow_call:
    inputs:
      policy-base-ref:
        description: Git ref used to detect modified historical migrations outside pull requests
        required: false
        type: string
        default: HEAD~1
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  policy:
    name: ci / policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Resolve migration policy baseline
        id: policy-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_BASE_REF: ${{ inputs.policy-base-ref || 'HEAD~1' }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$POLICY_BASE_REF" == "root-commit" ]]; then
            mapfile -t roots < <(git rev-list --max-parents=0 HEAD)
            if [[ "${#roots[@]}" -ne 1 ]]; then
              echo "ERROR: Expected exactly one root commit, found ${#roots[@]}"
              exit 1
            fi
            base_sha="${roots[0]}"
          elif [[ "$POLICY_BASE_REF" == "latest-tag" ]]; then
            if base_sha=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null); then
              :
            else
              base_sha=$(git rev-parse HEAD~1)
            fi
          else
            base_sha=$(git rev-parse "$POLICY_BASE_REF")
          fi
          git cat-file -e "${base_sha}^{commit}"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Validate append-only migrations and public-safe files
        env:
          BASE_SHA: ${{ steps.policy-base.outputs.base-sha }}
        run: node .github/scripts/pr-policy-check.mjs

      - name: Test PR policy checker
        run: node --test .github/scripts/pr-policy-check.test.mjs

      - name: Validate workflow YAML
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 # 1.7.12 linux/amd64
        with:
          args: -shellcheck=

  frontend:
    name: ci / frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit and property tests
        run: bun test tests/lib

      - name: Compile demo seed script
        run: bun build ../scripts/seed-demo-meetings.ts --target=bun --outdir="${{ runner.temp }}/briefli-seed-check"

      - name: Build production frontend
        run: pnpm build

  rust:
    name: ci / rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar-source: target/debug/llama-helper
            sidecar-destination: frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar-source: target/debug/llama-helper.exe
            sidecar-destination: frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar-source: target/debug/llama-helper
            sidecar-destination: frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev

      - name: Install Rust stable with formatting and lint tools
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: '. -> target'
          key: pr-${{ matrix.os }}

      - name: Build required llama-helper sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p llama-helper
          mkdir -p frontend/src-tauri/binaries
          cp '${{ matrix.sidecar-source }}' '${{ matrix.sidecar-destination }}'

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-HEAD~1}"
          mapfile -t changed_rust < <(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.rs')
          if [ "${#changed_rust[@]}" -eq 0 ]; then
            echo "No changed Rust files"
            exit 0
          fi
          rustfmt --edition 2021 --check "${changed_rust[@]}"

      - name: Compile Rust library and tests
        if: runner.os != 'macOS'
        run: cargo check -p briefli --lib --tests --locked

      - name: Compile updater signature verifier
        if: runner.os == 'Linux'
        run: cargo check -p briefli --example verify_updater_signature --locked

      - name: Run full Rust library tests
        if: runner.os != 'Windows'
        run: cargo test -p briefli --lib --locked -- --skip audio::playback_monitor::tests::test_get_output_device

      - name: Run full Rust library tests serially on Windows
        if: runner.os == 'Windows'
        run: cargo test -p briefli --lib --locked -- --test-threads=1 --skip audio::playback_monitor::tests::test_get_output_device

  integration:
    name: ci / integration
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Build a fresh database from every migration
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/briefli-integration.sqlite"
          for migration in $(find frontend/src-tauri/migrations -maxdepth 1 -name '*.sql' | sort); do
            echo "Applying $migration"
            sqlite3 "$db" < "$migration"
          done
          sqlite3 "$db" "PRAGMA integrity_check;" | grep -Fx ok
          echo "BRIEFLI_DB_PATH=$db" >> "$GITHUB_ENV"

      - name: Seed realistic meetings twice
        run: |
          bun scripts/seed-demo-meetings.ts
          bun scripts/seed-demo-meetings.ts

      - name: Verify seeded integration cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(sqlite3 "$BRIEFLI_DB_PATH" "SELECT COUNT(*) FROM meetings WHERE id LIKE 'demo-%';")" = "14"
          test "$(sqlite3 "$BRIEFLI_DB_PATH" "SELECT COUNT(*) FROM transcripts WHERE id LIKE 'demo-%';")" = "678"
          test "$(sqlite3 "$BRIEFLI_DB_PATH" "SELECT COUNT(*) FROM meeting_memories WHERE id LIKE 'demo-%';")" = "28"
          test "$(sqlite3 "$BRIEFLI_DB_PATH" "SELECT COUNT(*) FROM memory_spaces WHERE id LIKE 'demo-%';")" = "8"
          test "$(sqlite3 "$BRIEFLI_DB_PATH" "SELECT COUNT(*) FROM meeting_memories mm JOIN transcripts t ON t.id = mm.source_transcript_id WHERE mm.id LIKE 'demo-%' AND mm.source_excerpt != t.transcript;")" = "0"
          sqlite3 "$BRIEFLI_DB_PATH" "PRAGMA foreign_key_check;"

  desktop-build:
    name: ci / desktop (windows unsigned)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: '. -> target'
          key: pr-windows-desktop

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build required llama-helper sidecar
        shell: pwsh
        run: |
          cargo build --release -p llama-helper
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          Copy-Item target/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe

      - name: Build unsigned Windows desktop app
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: pnpm tauri build --no-bundle

  required:
    name: ci / required
    if: always()
    needs: [policy, frontend, rust, integration, desktop-build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every PR quality check
        env:
          POLICY: ${{ needs.policy.result }}
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DESKTOP: ${{ needs.desktop-build.result }}
        run: |
          printf '%-14s %s\n' policy "$POLICY"
          printf '%-14s %s\n' frontend "$FRONTEND"
          printf '%-14s %s\n' rust "$RUST"
          printf '%-14s %s\n' integration "$INTEGRATION"
          printf '%-14s %s\n' desktop "$DESKTOP"
          test "$POLICY" = success
          test "$FRONTEND" = success
          test "$RUST" = success
          test "$INTEGRATION" = success
          test "$DESKTOP" = success
